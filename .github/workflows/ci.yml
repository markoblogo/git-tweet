name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/git_tweet_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:validate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify Docker Compose runtime
        run: |
          cp .env.example .env.local
          docker compose up --build --detach --wait --wait-timeout 120
          curl --fail --silent --show-error 'http://127.0.0.1:3000/api/health?ready=1'
      - name: Stop Docker Compose runtime
        if: always()
        run: docker compose down --volumes
