version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/client"
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "@prisma/client"
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - prisma
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # 0.20 requires Node 22 and may contain pre-1.0 breaking changes.
      - dependency-name: "@atproto/api"
        versions:
          - ">=0.20.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
